<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>メニュー更新 - 日本酒バー霧島</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="menu.js"></script>
</head>
<body>
  <main style="max-width:960px;margin:2rem auto;padding:0 1.5rem 3rem;">
    <header class="section-header" style="margin-top:1rem;">
      <div>
        <p class="eyebrow">MENU OPS</p>
        <h1>メニュー更新ページ</h1>
        <p class="note">public/data/menu.json を更新するとトップページ・管理UIへ反映されます。</p>
      </div>
      <a class="ghost" href="index.html">トップへ戻る</a>
    </header>
    <section class="panel" style="margin-top:1rem;">
      <h3>現在のメニュー</h3>
      <table class="table" id="menuTable">
        <thead>
          <tr>
            <th>#</th>
            <th>カテゴリー</th>
            <th>品名</th>
            <th>価格</th>
            <th>ペアリング</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="note">JSONファイルは管理UI（admin.html）から操作するか、直接編集してアップロードできます。</p>
    </section>
  </main>
</body>
</html>
