<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE SUMMER TERRACE | 期間限定ビアガーデン</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">GRILL &amp; BEER GARDEN<br /><strong>THE SUMMER TERRACE</strong></div>
      <nav class="main-nav" id="mainNav" aria-label="ページ内メニュー"></nav>
      <button class="cta-mini" data-action="reserve">今すぐ予約する</button>
      <button class="hamburger" id="sidebarToggle" type="button" aria-label="診断を開く" aria-controls="diagnosis" aria-expanded="false">☰</button>
    </header>

    <div class="layout">
      <main>
        <section class="hero" id="hero"></section>
        <section class="features" id="features"></section>
        <section class="courses" id="courses"></section>
        <section class="split-panels" id="splitPanels"></section>
        <section class="scenes" id="scenes"></section>
        <section class="store-info" id="storeInfo"></section>
        <section class="faq" id="faq"></section>
      </main>

      <aside class="diagnosis" id="diagnosis" aria-label="おすすめ診断"></aside>
    </div>

    <div class="demo-status" id="demoStatus" role="status" aria-live="polite"></div>
    <footer class="footer" id="footer"></footer>
    <script src="app.js"></script>
  </body>
</html>
