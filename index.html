<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A4_Menu_Portrait</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body id="A4_Menu_Portrait">
  <main class="sheet">
    <section class="page" id="Front_Sake" aria-label="Front_Sake">
      <header class="page-header">
        <h1>旬の日本酒 お品書き</h1>
        <p class="sub">季節のおすすめと定番の銘柄を取り揃えています。</p>
      </header>
      <div class="cards" data-side="front"></div>
    </section>

    <section class="page" id="Back_Food" aria-label="Back_Food">
      <header class="page-header">
        <h1>酒肴とお食事</h1>
        <p class="sub">お酒に寄り添う一品料理と店舗情報。</p>
      </header>
      <div class="cards" data-side="back"></div>
      <div class="qr-note">店舗の最新情報はQRコードからご確認ください。</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
