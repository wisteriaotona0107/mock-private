<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>酒場シミュレーター - Mock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <div id="error-banner" class="error-banner hidden" role="alert">
    <span id="error-message"></span>
    <button id="error-dismiss" type="button">閉じる</button>
  </div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modal-title">注文詳細</h3>
        <button id="modal-close" class="text-button" type="button">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-provide" class="primary" type="button">提供する</button>
        <button id="modal-cancel" type="button">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
