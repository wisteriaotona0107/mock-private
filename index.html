<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI活用と制作フロー</title>
    <meta
      name="description"
      content="AIを使った企画・設計・実装・レビューの進め方と、人の判断ポイントを整理して紹介します。"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">Workflow Overview</p>
      <h1>AI活用と制作フロー紹介</h1>
      <p class="lead">
        AIを活用した制作プロセスを、役割分担と人の判断ポイントまで含めて簡潔に可視化します。
      </p>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="flow-title">
        <div class="panel-head">
          <h2 id="flow-title">制作フロー</h2>
          <p>段階ごとの目的・AIの役割・成果物を一覧化しています。</p>
        </div>
        <ol id="phase-list" class="phase-list" aria-live="polite"></ol>
      </section>

      <section class="grid-two">
        <article class="panel" aria-labelledby="tool-title">
          <div class="panel-head">
            <h2 id="tool-title">使用AIと役割</h2>
          </div>
          <ul id="tool-list" class="card-list"></ul>
        </article>

        <article class="panel" aria-labelledby="review-title">
          <div class="panel-head">
            <h2 id="review-title">人が判断するポイント</h2>
          </div>
          <ul id="review-list" class="note-list"></ul>
        </article>
      </section>

      <section class="panel" aria-labelledby="security-title">
        <div class="panel-head">
          <h2 id="security-title">セキュリティ・品質配慮</h2>
          <p>不安を減らすために、運用上の前提を明確にしています。</p>
        </div>
        <ul id="security-list" class="note-list"></ul>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>


    <script id="ai-workflow-inline" type="application/json">
{
  "phases": [
    {
      "name": "企画整理",
      "purpose": "要件や課題を分解し、目標と非目標を明確化する",
      "ai_role": "要件候補と論点の叩き台作成",
      "human_point": "優先度とビジネス妥当性を最終判断"
    },
    {
      "name": "情報設計",
      "purpose": "画面構成と情報の流れを組み立てる",
      "ai_role": "構成案・文案の複数パターン提案",
      "human_point": "伝わりやすさとブランド整合性を判断"
    },
    {
      "name": "実装",
      "purpose": "最小構成で機能を実装し、反復改善する",
      "ai_role": "コード補助・テスト観点の提案",
      "human_point": "設計意図、保守性、境界条件を確認"
    },
    {
      "name": "レビューと公開",
      "purpose": "品質と安全性を確認し、公開可否を判断する",
      "ai_role": "チェックリスト化と文書整備",
      "human_point": "公開判断・責任範囲・最終承認"
    }
  ],
  "tools": [
    {
      "name": "対話型AI",
      "role": "要件整理、論点抽出、説明文の下書き"
    },
    {
      "name": "コード補助AI",
      "role": "雛形生成、リファクタ候補、テスト観点補助"
    },
    {
      "name": "レビュー補助AI",
      "role": "抜け漏れ確認、文書整合、リスクの言語化"
    }
  ],
  "review_points": [
    "AI提案をそのまま採用せず、要件適合を毎回確認する",
    "法務・倫理・対外説明に関わる内容は必ず人が確定する",
    "公開前に再現手順とロールバック方針を人が承認する"
  ],
  "security_notes": [
    "機密情報・個人情報は入力ルールを定めて扱う",
    "生成物は静的解析・目視レビューを組み合わせて検証する",
    "依存ライブラリを最小限にして脆弱性リスクを抑える",
    "変更履歴を残し、公開判断の責任者を明確にする"
  ]
}

    </script>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
