<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吟味亭 | 日本酒居酒屋</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">吟味亭</div>
      <nav class="tabs" aria-label="主要ナビゲーション">
        <a href="index.html" aria-current="page">ホーム</a>
        <a href="menu.html">日本酒メニュー</a>
        <a href="shop.html">店舗情報</a>
      </nav>
    </header>

    <main class="container">
      <section class="hero card">
        <p class="eyebrow">Sake Discover Experience</p>
        <h1>あなたに合う一杯を、すぐ見つける。</h1>
        <p>
          来店前も店内でも使いやすい、日本酒探索サイト。味タイプ・香り・価格・ペアリングで比較できます。
        </p>
        <div class="actions">
          <a class="btn primary" href="menu.html">日本酒を探す</a>
          <a class="btn" href="shop.html">お店を見る</a>
        </div>
      </section>

      <section class="grid two-col" id="recommend-section" aria-labelledby="recommend-title">
        <h2 id="recommend-title">おすすめカテゴリ</h2>
        <article class="card">
          <h3>初心者向け</h3>
          <p>飲みやすいフルーティ系を中心に掲載。</p>
          <a href="menu.html?recommend=beginner">一覧を見る</a>
        </article>
        <article class="card">
          <h3>人気ランキング</h3>
          <p>店内オーダー上位の銘柄をチェック。</p>
          <a href="menu.html?recommend=popular">ランキングへ</a>
        </article>
        <article class="card">
          <h3>本日のおすすめ</h3>
          <p>季節や仕入れに合わせた注目酒。</p>
          <a href="menu.html?recommend=today">本日の一杯へ</a>
        </article>
      </section>
    </main>

    <footer class="footer">© <span id="year"></span> 吟味亭</footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
