<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>花見席取りシミュレーション</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="title-area card">
        <div>
          <h1>🌸 花見席取りシミュレーション</h1>
          <p>
            幹事としてベストポジションを確保しよう！
            桜の見やすさ・広さ・混雑のバランスで満足度が決まります。
          </p>
        </div>
        <div class="top-actions">
          <button id="startBtn" class="btn primary">ゲーム開始</button>
          <button id="resetBtn" class="btn secondary">リセット</button>
        </div>
      </header>

      <main class="layout-grid">
        <section class="map-area card">
          <div class="map-header">
            <h2>公園マップ</h2>
            <p id="mapHint">開始ボタンを押してゲームを始めてください。</p>
          </div>
          <div id="map" class="map" aria-label="公園マップ"></div>
          <div class="legend">
            <span><i class="legend-chip hanami"></i> 花見エリア</span>
            <span><i class="legend-chip path"></i> 通路</span>
            <span><i class="legend-chip tree"></i> 桜の木</span>
            <span><i class="legend-chip seat"></i> シート</span>
          </div>
        </section>

        <aside class="side-panels">
          <section class="info-panel card">
            <h2>情報パネル</h2>
            <dl id="statsList" class="stats-list"></dl>
          </section>

          <section class="control-panel card">
            <h2>操作パネル</h2>
            <div class="field-group">
              <label for="parkTypeSelect">公園タイプ</label>
              <select id="parkTypeSelect">
                <option value="random">ランダム</option>
                <option value="small">小規模公園</option>
                <option value="medium">中規模公園</option>
                <option value="famous">桜の名所</option>
              </select>
            </div>

            <div class="field-group">
              <label for="peopleSelect">参加人数</label>
              <select id="peopleSelect">
                <option value="random">ランダム</option>
                <option value="2">2人</option>
                <option value="4">4人</option>
                <option value="6">6人</option>
                <option value="8">8人</option>
              </select>
            </div>

            <div class="field-group">
              <p class="field-label">シートサイズ</p>
              <div class="sheet-options" id="sheetOptions"></div>
            </div>

            <div class="button-row">
              <button id="placeBtn" class="btn primary">配置モード</button>
              <button id="confirmBtn" class="btn success">決定</button>
            </div>
            <div class="button-row">
              <button id="nextTimeBtn" class="btn secondary">次の時間帯へ</button>
              <button id="retryBtn" class="btn secondary">再挑戦</button>
            </div>
            <p class="control-note">
              クリックでシートを仮置きし、決定でスコア確定。時間を進めると混雑が変わります。
            </p>
          </section>

          <section class="result-panel card" id="resultPanel">
            <h2>結果</h2>
            <div id="resultContent" class="result-content">まだ結果はありません。</div>
          </section>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
