<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>さけの ずかん</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <header class="title-panel">
      <h1>さけの ずかん</h1>
      <p>〜 あじを しるもの さけを しる 〜</p>
    </header>

    <main class="main-grid">
      <section class="panel command-panel">
        <h2>さがす</h2>
        <label class="input-label" for="searchInput">めいがら を えらんでください</label>
        <input id="searchInput" type="text" autocomplete="off" placeholder="めいがらを いれてください" />
        <div class="hint">↑↓でえらぶ / Enterでけってい</div>
        <ul id="searchList" class="list"></ul>
      </section>

      <section class="panel status-panel">
        <h2>ステータス</h2>
        <div id="brandStatus" class="status-content">
          <p>めいがら を えらんでください</p>
        </div>
      </section>
    </main>

    <section class="panel similar-panel">
      <h2>にている おさけ</h2>
      <ul id="similarList" class="list"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
