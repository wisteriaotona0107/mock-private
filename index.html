<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>経路可視化モック</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-card">
      <header class="app-header">
        <h1>経路可視化モック</h1>
        <p>行・列・経路数を指定してマスをタップ移動する学習用デモ</p>
      </header>

      <section class="config-card">
        <h2>グリッド設定</h2>
        <div class="config-row">
          <label>
            行（縦）
            <input id="rowsInput" type="number" min="1" value="4" />
          </label>
          <label>
            列（横）
            <input id="colsInput" type="number" min="1" value="5" />
          </label>
          <label>
            経路数
            <input id="routeCountInput" type="number" min="1" value="18" />
          </label>
          <button id="applyBtn" type="button">設定を反映</button>
        </div>
        <p class="config-note">※ マス数（行×列）を超える経路数は自動で切り詰めます。</p>
      </section>

      <section id="grid" class="route-grid" aria-label="経路グリッド"></section>

      <section class="status-card" aria-live="polite">
        <h2>現在位置</h2>
        <p id="currentRouteText" class="current-route-text">未選択</p>
      </section>

      <section class="history-card">
        <h2>通過履歴 (配列風)</h2>
        <pre id="historyText" class="history-text">まだ通過履歴はありません</pre>
      </section>

      <section class="controls">
        <button id="resetBtn" type="button" class="reset">リセット</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
