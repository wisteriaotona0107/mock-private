name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run prisma:generate
      - run: npm run test:unit
        env:
          DEV_MOCK_PROVIDER: '1'
      - run: npm run test:e2e
        env:
          DEV_MOCK_PROVIDER: '1'
      - run: npm run lighthouse
        env:
          DEV_MOCK_PROVIDER: '1'
