<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本酒メニュー | 酒香</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">酒香 Sake Lounge</a>
      <nav class="nav-links" aria-label="メインナビゲーション">
        <a href="index.html">ホーム</a>
        <a class="active" href="menu.html">日本酒メニュー</a>
        <a href="shop.html">店舗情報</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="section-title">日本酒メニュー</h1>
    <section class="controls" aria-label="検索とフィルタ">
      <input id="search-input" type="search" placeholder="銘柄・説明で検索" aria-label="日本酒検索" />
      <div class="control-row">
        <div>
          <label for="type-select">味タイプ</label>
          <select id="type-select"><option value="">すべて</option></select>
        </div>
        <div>
          <label for="rice-select">酒米</label>
          <select id="rice-select"><option value="">すべて</option></select>
        </div>
        <div>
          <label for="region-select">地域</label>
          <select id="region-select"><option value="">すべて</option></select>
        </div>
      </div>
      <div class="control-row">
        <div>
          <label for="sweet-select">甘辛</label>
          <select id="sweet-select">
            <option value="">すべて</option>
            <option value="sweet">甘口寄り</option>
            <option value="dry">辛口寄り</option>
          </select>
        </div>
        <div>
          <label for="body-select">軽さ</label>
          <select id="body-select">
            <option value="">すべて</option>
            <option value="light">軽い</option>
            <option value="rich">重い</option>
          </select>
        </div>
        <div>
          <label for="price-select">価格帯</label>
          <select id="price-select">
            <option value="">すべて</option>
            <option value="low">~799円</option>
            <option value="mid">800~999円</option>
            <option value="high">1000円~</option>
          </select>
        </div>
      </div>
    </section>

    <p id="result-count" class="meta"></p>
    <section id="menu-grid" class="grid" aria-live="polite"></section>
  </main>

  <footer class="site-footer">© 酒香 Sake Lounge</footer>

  <script src="js/menu.js" type="module"></script>
  <script src="js/search.js" type="module"></script>
</body>
</html>
